<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Schedule Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📺 TV Schedule Viewer</h1>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="showTab('channels')">채널 목록</button>
            <button class="tab-btn" onclick="showTab('schedule')">채널 편성표</button>
            <button class="tab-btn" onclick="showTab('date-schedule')">날짜별 편성표</button>
        </nav>

        <!-- 채널 목록 탭 -->
        <div id="channels" class="tab-content active">
            <h2>📋 채널 목록</h2>
            <div class="input-group">
                <label for="channelSearch">검색:</label>
                <input type="text" id="channelSearch" placeholder="채널명 또는 그룹으로 검색..." onkeyup="filterChannels()">
                <button onclick="loadChannels()" class="btn">채널 목록 조회</button>
            </div>
            <div id="channels-list" class="content-area"></div>
        </div>

        <!-- 채널 편성표 탭 -->
        <div id="schedule" class="tab-content">
            <h2>📅 채널 편성표</h2>
            <div class="input-group">
                <label for="channelId">채널 ID:</label>
                <input type="text" id="channelId" placeholder="예: KBS1" value="KBS1">
                <button onclick="loadSchedule()" class="btn">편성표 조회</button>
            </div>
            <div id="schedule-list" class="content-area"></div>
        </div>

        <!-- 날짜별 편성표 탭 -->
        <div id="date-schedule" class="tab-content">
            <h2>📆 날짜별 편성표</h2>
            <div class="input-group">
                <label for="dateChannelId">채널 ID:</label>
                <input type="text" id="dateChannelId" placeholder="예: KBS1" value="KBS1">
                <label for="scheduleDate">날짜:</label>
                <input type="date" id="scheduleDate">
                <button onclick="loadDateSchedule()" class="btn">편성표 조회</button>
            </div>
            <div id="date-schedule-list" class="content-area"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
